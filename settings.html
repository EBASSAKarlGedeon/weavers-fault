<div class="wv-settings" id="wv-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Weaver's Vault</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="wv-setrow" for="wv-rebuild-profile">
                <span class="wv-setlabel">Rebuild connection profile</span>
                <small class="wv-sethint">Every lorebook rebuild (capture sheet and scripted sheet) sends its requests to this profile. Choose it here once and a rebuild can no longer spend on an account you forgot was active.</small>
                <select id="wv-rebuild-profile" class="text_pole wv-setselect"></select>
            </label>
            <small class="wv-setnote" id="wv-rebuild-profile-note"></small>
        </div>
    </div>
</div>
